<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHABAN QR SCANNER</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(-45deg, #4a90e2, #00ff6a, #9b59b6, #e74c3c);
      background-size: 400% 400%;
      animation: bgMove 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #content {
      background: #000;
      border-radius: 20px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.4), 0 0 50px rgba(255, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    #qr-image {
      width: 100%;
      max-width: 320px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,255,0,0.6);
    }

    h2 {
      font-size: 1.8rem;
      margin: 0.5rem 0;
      text-shadow: 0 0 8px #0f0;
    }

    p.legend {
      font-size: 1rem;
      color: #ccc;
    }

    progress {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      appearance: none;
    }

    progress::-webkit-progress-bar {
      background-color: #222;
      border-radius: 10px;
    }

    progress::-webkit-progress-value {
      background: linear-gradient(90deg, #00ff00, #ff0000);
      border-radius: 10px;
    }

    .reload-button {
      background-color: transparent;
      color: #0f0;
      padding: 10px 20px;
      border: 2px solid #0f0;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #0f0;
    }

    .reload-button:hover {
      background-color: #0f0;
      color: black;
      box-shadow: 0 0 25px #0f0;
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 1.3rem;
      }

      .reload-button {
        width: 100%;
        padding: 12px;
      }
    }
  </style>

  <script>
    let timeleft = 30;
    const downloadTimer = setInterval(() => {
      if (timeleft <= 0) {
        clearInterval(downloadTimer);
        document.getElementById("progressBar").remove();
        document.getElementById("main").textContent = "QR Expired! Please reload";
        document.getElementById("legend").textContent = "";
      } else {
        document.getElementById("progressBar").value = 30 - timeleft;
        timeleft -= 1;
      }
    }, 1000);
  </script>
</head>
<body>
  <div id="content">
    <img id="qr-image" src="/server" alt="QR Code">
    <h2 id="main">HANS_TECH QR</h2>
    <p class="legend" id="legend">Scan the QR Code</p>
    <progress id="progressBar" value="0" max="30"></progress>
    <a href="javascript:history.go(0)" class="reload-button">Reload Page</a>
  </div>
</body>
</html>
